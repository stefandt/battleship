<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морський Бій 🚢💥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .battleship-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #1e293b; padding: 4px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 2px solid #334155; }
        .cell { aspect-ratio: 1 / 1; position: relative; border-radius: 2px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .cell-water { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
        .cell-ship { background: repeating-linear-gradient(45deg, #475569, #475569 4px, #334155 4px, #334155 8px); }
        .explosion { background-color: #991b1b !important; box-shadow: inset 0 0 15px #000; }
        .splash { background-color: #0c4a6e !important; }
        .falling-bomb { position: fixed; width: 12px; height: 30px; background: linear-gradient(to bottom, #111 60%, #ef4444 100%); z-index: 9999; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">
    <header class="text-center mb-6">
        <h1 class="text-4xl font-black text-blue-300">МОРСЬКИЙ БІЙ 🚢</h1>
        <p id="status-text" class="text-lg font-bold mt-2">Оберіть режим</p>
    </header>

    <div id="lobby-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl shadow-xl text-center">
        <button onclick="startBotGame()" class="w-full py-4 bg-purple-600 rounded-xl font-bold mb-4">🤖 Проти Бота</button>
        <button onclick="createGame()" id="btn-create" class="w-full py-4 bg-blue-600 rounded-xl font-bold">➕ Створити мережеву гру</button>
        <div id="connection-box" class="hidden mt-4 p-4 bg-slate-900 rounded-xl">
            <p id="my-id-display" class="text-2xl font-black text-emerald-400">...</p>
            <button onclick="copyLink()" class="mt-2 text-xs text-blue-400 underline">🔗 Скопіювати посилання</button>
        </div>
    </div>

    <div id="game-screen" class="hidden w-full max-w-4xl flex flex-col md:flex-row gap-8">
        <div class="w-full md:w-1/2">
            <h2 class="text-xl font-bold mb-2">Мій флот</h2>
            <div id="my-grid" class="battleship-grid w-full aspect-square"></div>
            <div id="my-stats" class="mt-2 text-blue-300 font-bold">Кораблів: 10</div>
            <button id="btn-shuffle" onclick="shuffleMyShips()" class="mt-4 px-4 py-2 bg-slate-700 rounded">🎲 Перемішати</button>
        </div>
        <div class="w-full md:w-1/2 relative">
            <h2 class="text-xl font-bold mb-2">Ворог</h2>
            <div id="enemy-grid" class="battleship-grid w-full aspect-square"></div>
            <div id="enemy-stats" class="mt-2 text-red-300 font-bold">Потоплено: 0</div>
            <div id="turn-overlay" class="absolute inset-0 bg-slate-900/60 hidden flex items-center justify-center font-black text-2xl">ХІД СУПРОТИВНИКА</div>
        </div>
    </div>

    <script>
        let myGrid, enemyGrid, myShipsData, enemyShipsData, botMemory = [], botHits = [], botHuntQueue = [];
        let isMyTurn = true, isBotMode = false, isGameOver = false;

        function createEmptyGrid() { return Array(10).fill(null).map(() => Array(10).fill(null).map(() => ({hasShip: false, fired: false, shipId: null, status: 'water'}))); }
        
        function startBotGame() {
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('btn-shuffle').classList.add('hidden');
            isBotMode = true;
            myGrid = createEmptyGrid(); enemyGrid = createEmptyGrid();
            placeShips(myGrid, myShipsData = []); placeShips(enemyGrid, enemyShipsData = []);
            renderGrids();
        }

        async function botShoot() {
            if (isGameOver || isMyTurn) return;
            let target;
            if (botHuntQueue.length > 0) {
                target = botHuntQueue.shift();
            } else {
                target = botMemory[Math.floor(Math.random() * botMemory.length)];
            }
            botMemory = botMemory.filter(p => !(p.r === target.r && p.c === target.c));
            await processShot(target.r, target.c, myGrid, myShipsData, 'my-grid', false);
        }

        async function processShot(r, c, grid, shipsData, prefix, isPlayer) {
            const cell = grid[r][c];
            cell.fired = true;
            if (cell.hasShip) {
                cell.status = 'hit';
                const ship = shipsData.find(s => s.id === cell.shipId);
                ship.hits++;
                if (ship.hits === ship.size) {
                    if (!isPlayer) botHuntQueue = []; // Скидаємо полювання, якщо потопили
                } else if (!isPlayer) {
                    // Розумний бот додає сусідів в чергу
                    [{r:r-1,c:c},{r:r+1,c:c},{r:r,c:c-1},{r:r,c:c+1}].forEach(n => {
                        if(n.r>=0 && n.r<10 && n.c>=0 && n.c<10) botHuntQueue.push(n);
                    });
                }
            } else {
                cell.status = 'miss';
            }
            renderGrids();
            if (!cell.hasShip) isMyTurn = !isMyTurn;
            updateUI();
            if (isBotMode && !isMyTurn) setTimeout(botShoot, 1000);
        }

        function renderGrids() { /* ... оновлює класи клітинок ... */ }
        function placeShips(grid, data) { /* ... рандомна розстановка ... */ }
        function updateUI() { document.getElementById('turn-overlay').classList.toggle('hidden', isMyTurn); }
        // ... функції PeerJS та інші ...
    </script>
</body>
</html>
