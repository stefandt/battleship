<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морський Бій 🚢💥</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        body { font-family: 'Nunito', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .battleship-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background-color: #1e293b; padding: 4px; border-radius: 8px; border: 2px solid #334155; }
        .cell { aspect-ratio: 1 / 1; position: relative; border-radius: 2px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: clamp(1rem, 4vw, 1.5rem); }
        .cell-water { background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); }
        .cell-ship { background: repeating-linear-gradient(45deg, #475569, #475569 4px, #334155 4px, #334155 8px); }
        .explosion { background-color: #ef4444 !important; }
        .splash { background-color: #0c4a6e !important; }
        .falling-bomb { position: fixed; width: 12px; height: 30px; background: linear-gradient(to bottom, #111 60%, #ef4444 100%); border-radius: 50% 50% 10% 10%; z-index: 9999; pointer-events: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4">

    <header class="text-center mb-6">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 tracking-wider">МОРСЬКИЙ БІЙ 🚢</h1>
        <p id="status-text" class="text-lg text-slate-300 mt-2 font-bold animate-pulse">Оберіть режим гри</p>
    </header>

    <div id="lobby-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-2xl border border-slate-700 text-center">
        <button onclick="startBotGame()" class="w-full py-4 bg-gradient-to-r from-purple-600 to-indigo-600 rounded-xl text-xl font-bold transition-transform active:scale-95">🤖 Грати з розумним Ботом</button>
    </div>

    <div id="game-screen" class="hidden w-full max-w-4xl flex-col md:flex-row gap-8 justify-center items-start">
        <div class="w-full md:w-1/2 flex flex-col items-center">
            <h2 class="text-2xl font-bold text-blue-300 mb-3">Мій Флот</h2>
            <div id="my-grid" class="battleship-grid w-full max-w-sm"></div>
        </div>
        <div class="w-full md:w-1/2 flex flex-col items-center">
            <h2 class="text-2xl font-bold text-red-400 mb-3">Супротивник</h2>
            <div id="enemy-grid" class="battleship-grid w-full max-w-sm"></div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 10;
        let myGrid = [], enemyGrid = [], myShipsData = [], enemyShipsData = [];
        let botMemory = [], huntQueue = [];

        function createEmptyGrid() {
            return Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(null).map(() => ({hasShip: false, fired: false, status: 'water'})));
        }

        function startBotGame() {
            myGrid = createEmptyGrid(); enemyGrid = createEmptyGrid();
            placeShips(myGrid, myShipsData); placeShips(enemyGrid, enemyShipsData);
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            renderGrid('my-grid', myGrid, false);
            renderGrid('enemy-grid', enemyGrid, true);
            botMemory = []; for(let r=0;r<10;r++) for(let c=0;c<10;c++) botMemory.push({r,c});
            updateUI('Ваш хід! 🎯', 'text-emerald-400');
        }

        async function botShoot() {
            let target;
            if (huntQueue.length > 0) {
                target = huntQueue.shift();
            } else {
                target = botMemory[Math.floor(Math.random() * botMemory.length)];
            }
            
            botMemory = botMemory.filter(p => !(p.r === target.r && p.c === target.c));
            await processShot(target.r, target.c, myGrid, myShipsData, 'my-grid', false);
        }

        async function processShot(r, c, grid, shipsData, containerPrefix, isPlayer) {
            const cell = grid[r][c]; cell.fired = true;
            if (cell.hasShip) {
                cell.status = 'hit';
                if (!isPlayer) {
                    // Розумний бот: додає сусідів у чергу
                    [{r:r-1, c}, {r:r+1, c}, {r, c:c-1}, {r, c:c+1}].forEach(p => {
                        if(p.r>=0 && p.r<10 && p.c>=0 && p.c<10 && !grid[p.r][p.c].fired) huntQueue.push(p);
                    });
                }
            } else {
                cell.status = 'miss';
            }
            renderGrid(containerPrefix, grid, !isPlayer);
            if (!isPlayer && !cell.hasShip) isMyTurn = true;
            if (isPlayer && !cell.hasShip) setTimeout(botShoot, 1000);
        }

        // ... (інші функції: placeShips, renderGrid тощо — залишаються без змін)
    </script>
</body>
</html>
